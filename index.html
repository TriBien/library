<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A mobile-first reading library of book reviews.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf9f7">
<title>Library</title>
<link rel="stylesheet" href="assets/css/styles.css">

<!-- Favicon (browser tab icon) -->
    <link rel="icon" href="icons/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="icons/favicon.ico" type="image/x-icon" />

    <!-- PNG favicon alternatives (better for modern browsers) -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />

    <!-- Apple Touch Icon (when saved to iOS home screen) -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons/apple-touch-icon.png"
    />

    <!-- Android / PWA Icon -->
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#ffffff" 

</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="appbar" id="appbar">
  <div class="appbar__titles">
    <h1 class="appbar__title" id="screen-title">Library</h1>
    <p class="appbar__subtitle" id="screen-subtitle"></p>
  </div>
  <div class="appbar__actions" id="appbar-actions"></div>
</header>

<main class="main" id="main" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="Primary">
  <a class="tab" href="#/" data-tab="library">
    <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a3 3 0 0 1 2 1.7A3 3 0 0 1 14 4h4.5A1.5 1.5 0 0 1 20 5.5v12a1.5 1.5 0 0 1-1.5 1.5H14a1.5 1.5 0 0 0-1.2.6l-.3.4a1 1 0 0 1-1.5 0l-.3-.4a1.5 1.5 0 0 0-1.2-.6H5.5A1.5 1.5 0 0 1 4 17.5z"/></svg>
    <span class="tab__label">Library</span>
  </a>
  <a class="tab" href="#/history" data-tab="history">
    <svg class="tab__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5A8.5 8.5 0 0 0 12 3.5m.9 12.6-3.4-3.4 1.1-1.1 2.3 2.3 4.6-4.6 1.1 1.1z"/></svg>
    <span class="tab__label">History</span>
    <span class="tab__badge" id="history-badge" hidden></span>
  </a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/vendor/marked.min.js"></script>
<script src="assets/js/gdrive.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
